name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Install and check example
        run: |
          python -m pip install .
          har-brief examples/demo.har --format json > actual.json
          python -c "import json; assert json.load(open('actual.json')) == json.load(open('examples/demo.json'))"
