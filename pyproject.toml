[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "har-brief"
version = "0.1.0"
description = "Offline, allowlist-built HAR performance briefs without captured text"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "har-brief contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
har-brief = "har_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
